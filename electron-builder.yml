appId: 'pclauncher'
productName: 'PlayClan Launcher'
artifactName: 'PlayClan-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 PlayClan'

asar: true
compression: 'maximum'
npmRebuild: false
buildDependenciesFromSource: false

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'PlayClan-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  notarize: false
  entitlements: 'build/entitlements.mac.plist'
  entitlementsInherit: 'build/entitlements.mac.plist'
  hardenedRuntime: true

dmg:
  sign: false

#afterSign: 'scripts/notarize.js'

# Linux Configuration
linux: 
  target:
    - target: 'AppImage'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'PlayClan-Launcher-${version}-${arch}.${ext}'
  maintainer: 'PlayClan'
  vendor: 'PlayClan'
  synopsis: 'PlayClan Launcher'
  description: 'PlayClan Launcher'
  category: 'Game'
  mimeTypes: 
    - 'x-scheme-handler/pclauncher'

directories:
  buildResources: 'build'
  output: 'dist'

protocols:
  name: 'PlayClan Launcher'
  schemes: 
    - 'pclauncher'